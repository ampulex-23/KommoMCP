name: kommo_tags
category: tags
keywords:
  - тег
  - tag
  - метка
  - пометить
  - отметить
  - категория
  - группировка
description: |
  Управление тегами: список, добавление, удаление, поиск по тегу.
actions:
  - action: list - список тегов
  - action: add - добавить тег к сущности
  - action: remove - удалить тег
  - action: search_by_tag - найти сущности по тегу
  - entity_type: leads/contacts/companies
  - entity_id: ID сущности
  - tag_name: название тега
examples:
  - query: "Покажи все теги"
  - query: "Добавь тег VIP к сделке 123"
  - query: "Найди все сделки с тегом Горячий"
  - query: "Удали тег из контакта"
response_format: |
  Возвращает: tags (список) или entities (найденные по тегу)

---
name: kommo_custom_fields
category: tags
keywords:
  - поле
  - field
  - кастомное
  - дополнительное
  - значение поля
  - установить поле
  - атрибут
  - удалить поле
  - создать поле
  - переименовать поле
description: |
  Полное управление кастомными полями: CRUD, массовые операции, значения.
  Типы полей: text, numeric, checkbox, select, multiselect, date, url, textarea, radiobutton, streetaddress, smart_address, birthday, legal_entity, date_time, tracking_data.
  Алиасы: price/money/budget -> numeric, list -> select, switch -> radiobutton.
actions:
  - action: list - список полей (all_types=true для всех сущностей)
  - action: create - создать поле (field_name, field_type, enums, entity_type)
  - action: update - обновить поле (field_id, field_name, enums)
  - action: delete - удалить поле (field_id, entity_type)
  - action: delete_all - удалить ВСЕ поля (confirm=true, all_types=true)
  - action: get_values - значения полей сущности (entity_id)
  - action: set_value - установить значение (entity_id, field_id, value)
  - action: set_values_bulk - установить несколько значений (entity_id, fields_values)
  - entity_type: leads/contacts/companies
examples:
  - query: "Покажи все кастомные поля"
  - query: "Создай поле Бюджет типа numeric для сделок"
  - query: "Удали поле 12345"
  - query: "Удали все кастомные поля"
  - query: "Установи поле Бюджет = 100000 для сделки 123"
  - query: "Какие поля есть у контактов"
response_format: |
  Возвращает: fields (список), success, или preview (для delete_all без confirm)

