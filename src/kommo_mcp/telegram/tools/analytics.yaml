name: kommo_funnel_analysis
category: analytics
keywords:
  - воронка
  - funnel
  - потери
  - где теряем
  - узкое место
  - bottleneck
  - проблемный этап
description: |
  Глубокий анализ воронки: где теряются сделки, узкие места.
actions:
  - pipeline_id: ID воронки
  - days: период анализа
