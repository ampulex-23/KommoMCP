name: kommo_export
category: analytics
keywords:
  - экспорт
  - выгрузка
  - csv
  - скачать
  - таблица
  - export
  - данные
  - список сделок
  - список контактов
description: |
  Экспорт данных CRM: сделки, контакты, аналитика в табличном формате.
actions:
  - action: leads_csv - выгрузка сделок (ID, название, бюджет, статус, воронка, ответственный, дата)
  - action: contacts_csv - выгрузка контактов (ID, имя, телефон, email, ответственный, дата)
  - action: analytics - сводная аналитика по всем воронкам
  - pipeline_id: фильтр по воронке (опционально)
  - limit: макс. строк (по умолчанию 100, макс 500)
examples:
  - query: "Выгрузи все сделки"
  - query: "Экспорт контактов в CSV"
  - query: "Покажи сводную аналитику"
  - query: "Список всех сделок в таблице"
response_format: |
  Возвращает: csv_data (текст), rows count

---
name: kommo_digest
category: analytics
keywords:
  - дайджест
  - утренний
  - сводка
  - итоги
  - задачи на сегодня
  - недельный отчёт
  - briefing
  - digest
  - мои задачи
  - что нового
description: |
  Дайджесты и сводки CRM: утренний брифинг, недельный отчёт, задачи на сегодня.
actions:
  - action: morning - утренний дайджест (сделки, задачи, просрочки, зависшие)
  - action: weekly - недельный отчёт (новые, выигранные, проигранные, задачи)
  - action: my_tasks - мои задачи (просроченные, на сегодня, предстоящие)
  - user_id: ID пользователя CRM (для my_tasks)
examples:
  - query: "Утренний дайджест"
  - query: "Что нового за неделю?"
  - query: "Мои задачи на сегодня"
  - query: "Сводка по CRM"
  - query: "Итоги недели"
response_format: |
  Возвращает: структурированные данные для форматирования

---
name: kommo_advisor
category: analytics
keywords:
  - совет
  - рекомендация
  - что делать
  - подсказка
  - анализ потерь
  - закрытие сделки
  - возражения
  - advisor
  - tips
  - next action
  - оптимизация воронки
description: |
  AI-советник по CRM: рекомендации по сделкам, воронкам, работе с возражениями.
actions:
  - action: next_action - что делать дальше по сделке (lead_id обязателен)
  - action: pipeline_tips - рекомендации по оптимизации воронки
  - action: loss_analysis - анализ причин потерь сделок
  - action: closing_tips - советы по закрытию конкретной сделки (lead_id обязателен)
  - action: objections - гайд по работе с возражениями на основе данных CRM
  - lead_id: ID сделки (для next_action, closing_tips)
  - pipeline_id: ID воронки (для pipeline_tips, loss_analysis)
examples:
  - query: "Что делать с этой сделкой?"
  - query: "Как оптимизировать воронку?"
  - query: "Почему мы теряем сделки?"
  - query: "Помоги закрыть сделку"
  - query: "Какие возражения бывают?"
  - query: "Советы по продажам"
response_format: |
  Возвращает: данные CRM + hint для AI-генерации рекомендаций
