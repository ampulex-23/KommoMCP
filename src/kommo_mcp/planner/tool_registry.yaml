    name: kommo_deals_ext
    category: deals
    description: Extended deal management
    capabilities: [deal_analysis, deal_health, deal_velocity, at_risk_deals]
    actions:
      - id: by_stage
        inputs: ["pipeline_id?"]
        outputs: [deals_by_stage]
      - id: health
        inputs: ["pipeline_id?"]
        outputs: [deal_health_score]
      - id: velocity
        inputs: ["pipeline_id?"]
        outputs: [sales_velocity, cycle_time]
      - id: at_risk
        inputs: ["pipeline_id?", "days?"]
        outputs: [at_risk_deals, risk_score]
      - id: by_user
        inputs: ["user_id?"]
        outputs: [deals_by_user]
    preconditions: []
    effects: []
    cost: 0.2

  - id: kommo_deal_intelligence
    name: kommo_deal_intelligence
