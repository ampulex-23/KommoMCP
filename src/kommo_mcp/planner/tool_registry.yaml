# ============================================================
# GRAPH EDGES: Define relationships between tools
# ============================================================
edges:
  # Sequence edges: tool A should run before tool B
  - from: kommo_list_pipelines
    to: kommo_pipeline_analytics
    type: SEQUENCE
    weight: 0.9
    reason: Need pipeline_id for analytics

  - from: kommo_list_pipelines
    to: kommo_setup
    type: SEQUENCE
    weight: 0.8
    reason: Need to know existing pipelines before modifying

  - from: kommo_search
    to: kommo_entity_actions
    type: SEQUENCE
    weight: 0.9
    reason: Find entity first, then act on it

  - from: kommo_search
    to: kommo_deal_intelligence
    type: SEQUENCE
    weight: 0.8
    reason: Find deal first, then analyze

  - from: kommo_search
    to: kommo_advisor
    type: SEQUENCE
    weight: 0.7
    reason: Find deal for context-specific advice

  - from: kommo_contacts_ext
    to: kommo_contact_enrichment
    type: SEQUENCE
    weight: 0.8
    reason: Find contact first, then enrich

  - from: kommo_contacts_ext
    to: kommo_contact_scoring
    type: SEQUENCE
    weight: 0.7
    reason: Find contacts, then score them

  - from: kommo_entity_actions.add_note
    to: kommo_entity_actions.create_task
    type: SEQUENCE
    weight: 0.5
    reason: Often note + follow-up task together

  - from: kommo_entity_actions.move_lead
    to: kommo_entity_actions.add_note
    type: SEQUENCE
    weight: 0.6
    reason: Document stage change with a note

  - from: kommo_advisor.qualification
    to: kommo_entity_actions.add_note
    type: SEQUENCE
    weight: 0.7
    reason: Save qualification results as note

  - from: kommo_forecast.deal_probability
    to: kommo_advisor.closing_tips
    type: SEQUENCE
    weight: 0.6
    reason: Get probability, then closing advice

  - from: kommo_deal_intelligence.closing_signals
    to: kommo_templates.closing_script
    type: SEQUENCE
    weight: 0.7
    reason: Detect signals, then prepare closing script

  - from: kommo_communication_analytics.sentiment
    to: kommo_advisor.communication_style
    type: SEQUENCE
    weight: 0.6
    reason: Understand sentiment, then adapt style

  - from: kommo_insights.stale_analysis
    to: kommo_reactivation.sleeping
    type: SEQUENCE
    weight: 0.7
    reason: Find stale deals, then reactivate

  - from: kommo_loss_analysis.reasons
    to: kommo_advisor.strategy
    type: SEQUENCE
    weight: 0.6
    reason: Understand losses, then strategize

  # Parallel edges: tools that can run simultaneously
  - from: kommo_pipeline_analytics
    to: kommo_manager_stats
    type: PARALLEL
    weight: 0.8
    reason: Independent analytics can run in parallel

  - from: kommo_contact_scoring
    to: kommo_communication_analytics
    type: PARALLEL
    weight: 0.7
    reason: Independent analyses

  - from: kommo_alerts.check
    to: kommo_digest.morning
    type: PARALLEL
    weight: 0.8
    reason: Both are read-only summaries

  - from: kommo_forecast.pipeline
    to: kommo_pipeline_health.check
    type: PARALLEL
    weight: 0.8
    reason: Independent pipeline analyses

  # Requires edges: tool A requires output of tool B
  - from: kommo_entity_actions.move_lead
    to: kommo_list_pipelines
    type: REQUIRES
    weight: 1.0
    reason: Need pipeline_id and status_id to move

  - from: kommo_setup.create_stage
    to: kommo_list_pipelines
    type: REQUIRES
    weight: 1.0
    reason: Need pipeline_id to create stage

  - from: kommo_bulk_actions.mass_move
    to: kommo_list_pipelines
    type: REQUIRES
    weight: 1.0
    reason: Need pipeline_id and status_id for mass move

  - from: kommo_mock_data.leads
    to: kommo_list_pipelines
    type: REQUIRES
    weight: 1.0
    reason: Need pipeline_id to create leads

  - from: kommo_catalogs.link_to_lead
    to: kommo_catalogs.list_elements
    type: REQUIRES
    weight: 0.9
    reason: Need element_id to link

