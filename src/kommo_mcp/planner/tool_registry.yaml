# Tool Graph Registry for MCP Agent
# Each tool defines: id, name, category, actions (with inputs/outputs/preconditions/effects)
# Graph edges: REQUIRES (dependency), PRODUCES (output), SEQUENCE (ordering), PARALLEL (can run together)

tools:
  # ============================================================
  # CATEGORY: Pipeline & Analytics (read-only, no preconditions)
  # ============================================================
  - id: kommo_list_pipelines
    name: kommo_list_pipelines
    category: pipeline
    description: List all pipelines with stages
    capabilities: [list_pipelines, get_stages]
    inputs: []
    outputs: [pipeline_id, pipeline_name, stage_id, stage_name]
    preconditions: []
    effects: []
    cost: 0.1

  - id: kommo_pipeline_analytics
    name: kommo_pipeline_analytics
    category: analytics
    description: Pipeline conversion rates, deal counts, revenue by stage
    capabilities: [pipeline_analytics, conversion_rates, stage_stats]
    inputs: ["pipeline_id?"]
    outputs: [conversion_rate, deal_count, revenue_by_stage, stage_stats]
    preconditions: []
    effects: []
    cost: 0.2

  - id: kommo_manager_stats
    name: kommo_manager_stats
    category: analytics
    description: Manager performance statistics
    capabilities: [manager_stats, performance_metrics]
    inputs: ["user_id?"]
    outputs: [manager_stats, deals_count, won_sum, conversion]
    preconditions: []
    effects: []
    cost: 0.2

  # ============================================================
  # CATEGORY: Deals
  # ============================================================
