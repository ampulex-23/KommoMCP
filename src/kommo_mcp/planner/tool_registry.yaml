        outputs: [deal_health, issues, strengths]
      - id: pipeline_review
        inputs: ["pipeline_id?"]
        outputs: [pipeline_issues, action_items]
      - id: closing_signals
        inputs: [lead_id]
        outputs: [closing_signals, close_probability]
    preconditions: []
    effects: []
    cost: 0.3

