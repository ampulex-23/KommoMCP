server {
    listen 80;
    server_name _;

    location /webhook/kommo {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
    }

    location /oauth/callback {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
    }
}
